<!DOCTYPE html>
<html>
<head>
  <title>Parc Informatique</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 20px; 
      background: #f4f6f9;
      color: #333;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
      margin-bottom: 20px;
    }
    nav {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
      list-style: none;
      padding: 0;
    }
    nav li {
      display: inline;
      margin: 0 10px;
    }
    nav a {
      text-decoration: none;
      padding: 8px 15px;
      background: #3498db;
      color: white;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    nav a:hover {
      background: #2980b9;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td { 
      border: 1px solid #ddd; 
      padding: 10px; 
      text-align: left; 
    }
    th { 
      background: #3498db; 
      color: white; 
    }
    tr:nth-child(even) { 
      background: #f9f9f9; 
    }
    form { 
      margin: 15px 0; 
      background: white; 
      padding: 15px; 
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, select {
      padding: 6px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button { 
      margin-left: 5px; 
      padding: 6px 12px; 
      border: none; 
      background: #2ecc71; 
      color: white; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: background 0.3s ease;
    }
    button:hover { 
      background: #27ae60; 
    }
  </style>
</head>
<body>
  <h1>Gestion du Parc Informatique</h1>
  <nav>
    <li><a href="{{ url_for('employees') }}">👨‍💼 Employés</a></li>
    <li><a href="{{ url_for('devices') }}">💻 Appareils</a></li>
    <li><a href="{{ url_for('maintenance') }}">🛠️ Maintenance</a></li>
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
